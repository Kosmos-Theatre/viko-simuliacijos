<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Projektoriaus ekranas – kompleksiškumo mokyklos simuliacija</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0c0f12;--surface:#13181d;--line:#232c34;--fg:#e8edf2;--muted:#8c9aa6;
 --accent:#4fd1a5;--warn:#e8a33d;--bad:#e0564f;--amb:#7db7ff;
 --fs:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
 --fm:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--fs);line-height:1.5;
 padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
 padding-block:18px 36px}
h1{font-size:clamp(1.3rem,2.4vw,1.9rem);font-weight:600;margin:.1em 0 .25em;letter-spacing:-.01em}
h2{font-size:1rem;font-weight:600;margin:0}
.eyebrow{font-family:var(--fm);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
.wrap{max-width:1600px;margin:0 auto}
.split{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:.83rem}
button{font-family:var(--fs);font-size:.95rem;font-weight:500;color:var(--fg);background:var(--surface);
 border:1px solid var(--line);border-radius:9px;padding:11px 15px;cursor:pointer;width:100%}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#07140f;border-color:var(--accent);font-weight:600}
textarea,select{font-family:var(--fm);font-size:.95rem;width:100%;background:var(--bg);color:var(--fg);
 border:1px solid var(--line);border-radius:9px;padding:11px 12px;resize:vertical}
textarea{min-height:170px;line-height:1.8;letter-spacing:.04em}
label.eyebrow{display:block;margin-bottom:5px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pod{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.pod canvas{width:100%;height:76px;display:block;border-radius:6px;background:rgba(127,127,127,.07);margin-bottom:8px}
.stat{display:flex;justify-content:space-between;font-family:var(--fm);font-size:.78rem;padding:1px 0}
.bar{height:5px;border-radius:3px;background:rgba(127,127,127,.18);overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%}
.badge{font-family:var(--fm);font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;
 border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted);white-space:nowrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--fm);font-size:.72rem;color:var(--muted);margin-bottom:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
table{border-collapse:collapse;width:100%;font-family:var(--fm);font-size:.84rem}
th,td{text-align:right;padding:7px 9px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
.scroll{overflow-x:auto}
#qr{background:#fff;padding:10px;border-radius:8px;display:inline-block;line-height:0}
.err{color:var(--bad);font-family:var(--fm);font-size:.8rem}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
</style>
</head>
<body>
<div class="wrap">
<div class="split">

  <div class="card">
    <p class="eyebrow">Strateginis valdymas · 09</p>
    <h2 style="margin-bottom:12px">Kompleksiškumo simuliacija</h2>

    <label class="eyebrow" for="scen">Aplinka</label>
    <select id="scen">
      <option value="turbulentiskas" selected>Turbulentiška</option>
      <option value="stabilus">Stabili</option>
    </select>

    <hr>
    <label class="eyebrow" for="codes">Grupių kodai — po vieną eilutėje</label>
    <textarea id="codes" spellcheck="false" placeholder="1-AT-214312-6&#10;2-BT-131242-7"></textarea>
    <p class="err" id="err" hidden></p>
    <button class="primary" id="drawBtn" style="margin-top:8px">Rodyti rezultatus</button>
    <button id="revealBtn" style="margin-top:8px">Atskleisti režimus</button>

    <hr>
    <p class="eyebrow" style="margin-bottom:8px">Prisijungimas telefonu</p>
    <div id="qr"></div>
    <p class="mono small" id="url" style="word-break:break-all;margin-top:8px">—</p>
  </div>

  <div>
    <div class="legend">
      <span><i class="dot" style="background:#3a4652"></i>Nežinantys</span>
      <span><i class="dot" style="background:#e8a33d"></i>Lankytojai</span>
      <span><i class="dot" style="background:#4fd1a5"></i>Nuolatiniai</span>
      <span><i class="dot" style="background:#7db7ff"></i>Ambasadoriai</span>
      <span><i class="dot" style="background:#e0564f"></i>Nusivylę</span>
    </div>
    <div class="board" id="board"><p class="muted">Suveskite grupių kodus kairėje.</p></div>
    <div class="card scroll" id="tableCard" style="margin-top:16px" hidden>
      <table id="tbl"></table>
      <p class="small muted" id="verdict" style="margin-top:12px"></p>
    </div>
  </div>

</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ============ VARIKLIS (identiškas telefono puslapiui) ============ */
var POP=140,ROUNDS=6;
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;var t=Math.imul(a^(a>>>15),1|a);
 t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function initState(){return {U:112,V:18,R:8,A:2,D:0,B:100,C:30,Q:.70,Rep:.50,
 ambBonus:0,qDebt:0,throttle:0,learn:0,pending:0,log:[]};}
var MOVES={
 valdymas:[{id:'kampanija',name:'Reklamos kampanija',cost:12},{id:'pajegumai',name:'Plėsti pajėgumus',cost:15},
  {id:'isakymas',name:'Įsakyti kokybę',cost:8},{id:'kaina',name:'Kelti kainas',cost:0}],
 apribojimai:[{id:'taisykle',name:'Paprasta taisyklė',cost:4},{id:'riba',name:'Apribojimas: 80 % talpos',cost:2},
  {id:'eksperimentas',name:'Safe-to-fail eksperimentas',cost:6},{id:'bendruomene',name:'Sprendimą atiduoti bendruomenei',cost:5}]};
var SHOCKS={turbulentiskas:{
  3:{name:'Finansavimas sumažėja 30 %',apply:function(s,m){s.B*=(1-.30*m);}},
  5:{name:'Gretimai atsidaro konkurentas',apply:function(s,m){s.Rep-=.15*m;s.V*=(1-.20*m);}}},stabilus:{}};
function step(st,moveId,mode,round,scenario,seed){
 var s={};for(var k in st)s[k]=st[k];s.log=[];
 var rnd=mulberry32(seed*7919+round*104729);
 var ambMult=mode==='valdymas'?.5:1.65,shockMult=mode==='valdymas'?2.2:.55;
 var demandBoost=0,qBoost=0,repDelta=0;
 var list=MOVES[mode],mv=null;for(var i=0;i<list.length;i++)if(list[i].id===moveId)mv=list[i];
 if(!mv)mv=list[0];var cost=mv.cost;
 qBoost+=s.pending;s.pending=0;qBoost-=s.qDebt;s.qDebt=0;
 if(mv.id==='kampanija'){demandBoost+=.10;repDelta+=.02;}
 else if(mv.id==='pajegumai'){s.C+=8;}
 else if(mv.id==='isakymas'){qBoost+=.15;s.qDebt=.08;}
 else if(mv.id==='kaina'){s.B+=15;repDelta-=.06;}
 else if(mv.id==='taisykle'){s.ambBonus+=.0022;}
 else if(mv.id==='riba'){s.throttle=.8;qBoost+=.05;}
 else if(mv.id==='eksperimentas'){if(rnd()<.6){repDelta+=.04;s.learn+=.012;}}
 else if(mv.id==='bendruomene'){s.pending=.05;s.ambBonus+=.0012;repDelta+=.03;}
 var sh=(SHOCKS[scenario]||{})[round];
 if(sh){sh.apply(s,shockMult);s.shock=sh.name;}else s.shock=null;
 var effC=s.throttle?s.C*s.throttle:s.C;
 var demand=s.V+s.R+s.A*1.2+(s.Rep+demandBoost)*s.U*.085;
 var load=demand/Math.max(effC,1);
 var qTarget=clamp((1.38-.55*load)*(.55+.45*s.Rep)+qBoost+s.learn,.10,1);
 s.Q=clamp(s.Q+.5*(qTarget-s.Q),.05,1);
 var recruit=s.Rep*.055+s.A*(.0045+s.ambBonus)*ambMult+demandBoost;
 var uv=s.U*clamp(recruit,0,.35),vr=s.V*(s.Q*.36),vd=s.V*((1-s.Q)*.18),
     ra=s.R*(s.Q*.13),rd=s.R*((1-s.Q)*.15),ar=s.A*((1-s.Q)*.32),du=s.D*.18;
 s.U+=-uv+du;s.V+=uv-vr-vd;s.R+=vr-ra-rd+ar;s.A+=ra-ar;s.D+=vd+rd-du;
 var income=s.V*.8+s.R*1.7+s.A*1.3;
 s.B+=income-s.C*.5-demand*.28-cost;
 if(s.B<0){s.C=Math.max(10,s.C-6);s.Rep-=.05;s.B=Math.max(s.B,-25);}
 if(scenario==='stabilus')s.Rep+=.012;
 s.Rep=clamp(s.Rep+(s.Q-.62)*.09+s.A*.0025-s.D*.0022+repDelta,0,1);
 var tot=s.U+s.V+s.R+s.A+s.D,k2=POP/tot;s.U*=k2;s.V*=k2;s.R*=k2;s.A*=k2;s.D*=k2;
 s.throttle=mv.id==='riba'?.8:0;
 return s;}
function score(s){return Math.round(s.R*3+s.A*7+s.B*.2+s.Rep*50-s.D*2);}
var MODE_LABEL={valdymas:'Režimas A',apribojimai:'Režimas B'};
var MODE_REAL={valdymas:'A · Tiesioginis valdymas',apribojimai:'B · Apribojimai'};

/* ============ KODŲ SKAITYMAS ============ */
function parseCode(raw){
 var t=raw.trim().toUpperCase().replace(/\s+/g,'');
 var m=t.match(/^(\d)-([AB])([TS])-([1-4]{6})-(\d)$/);
 if(!m)return {error:'netinkamas formatas'};
 var body=m[4],sum=0;for(var i=0;i<body.length;i++)sum+=+body[i];
 if(sum%9!==+m[5])return {error:'kontrolinis skaičius nesutampa — tikriausiai apsirikta renkant'};
 return {g:+m[1],mode:m[2]==='A'?'valdymas':'apribojimai',
         scen:m[3]==='T'?'turbulentiskas':'stabilus',
         idxs:body.split('').map(Number)};
}
function replay(p){
 var s=initState(),hist=[s];
 for(var i=0;i<p.idxs.length;i++){
  var mv=MOVES[p.mode][p.idxs[i]-1];
  s=step(s,mv.id,p.mode,i+1,p.scen,p.g);hist.push(s);}
 return {final:s,hist:hist};
}

/* ============ VAIZDAS ============ */
var revealed=false;
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){
 return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function swarm(cv,st){
 var w=cv.clientWidth||260,h=76,dpr=Math.min(window.devicePixelRatio||1,2);
 cv.width=w*dpr;cv.height=h*dpr;var c=cv.getContext('2d');
 c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);
 var cols=20,rows=Math.ceil(POP/cols),cw=w/cols,ch=h/rows,r=Math.max(1.8,Math.min(cw,ch)/2-1.2),i=0;
 [['U','#3a4652'],['V','#e8a33d'],['R','#4fd1a5'],['A','#7db7ff'],['D','#e0564f']]
 .forEach(function(p){var n=Math.round(st[p[0]]);c.fillStyle=p[1];
  for(var j=0;j<n&&i<POP;j++,i++){var x=(i%cols)*cw+cw/2,y=Math.floor(i/cols)*ch+ch/2;
   c.beginPath();c.arc(x,y,r,0,6.284);c.fill();}});
}
function draw(){
 var lines=$('codes').value.split('\n').filter(function(l){return l.trim();});
 var rows=[],errs=[];
 lines.forEach(function(l){
  var p=parseCode(l);
  if(p.error){errs.push(l.trim()+' — '+p.error);return;}
  var r=replay(p),st=r.final;
  rows.push({g:p.g,mode:p.mode,st:st,sc:score(st),idxs:p.idxs,scen:p.scen});});
 $('err').hidden=!errs.length;$('err').textContent=errs.join(' · ');
 var board=$('board');board.innerHTML='';
 if(!rows.length){board.innerHTML='<p class="muted">Suveskite grupių kodus kairėje.</p>';
  $('tableCard').hidden=true;return;}
 rows.sort(function(a,b){return a.g-b.g;});
 rows.forEach(function(r){
  var st=r.st,pod=document.createElement('div');pod.className='pod';
  pod.innerHTML='<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">'+
   '<strong style="font-size:.92rem">'+r.g+' grupė</strong><span class="badge">'+
   (revealed?MODE_REAL[r.mode]:MODE_LABEL[r.mode])+'</span></div><canvas></canvas>'+
   '<div class="stat"><span>nuolatiniai / ambasadoriai</span><span>'+Math.round(st.R)+' / '+Math.round(st.A)+'</span></div>'+
   '<div class="stat"><span>nusivylę</span><span>'+Math.round(st.D)+'</span></div>'+
   '<div class="stat"><span>kokybė</span><span>'+st.Q.toFixed(2)+'</span></div>'+
   '<div class="bar"><i style="width:'+(st.Q*100)+'%;background:'+
     (st.Q<.4?'#e0564f':st.Q<.6?'#e8a33d':'#4fd1a5')+'"></i></div>'+
   '<div class="stat" style="margin-top:4px"><span>reputacija</span><span>'+st.Rep.toFixed(2)+'</span></div>'+
   '<div class="bar"><i style="width:'+(st.Rep*100)+'%;background:#7db7ff"></i></div>'+
   '<div class="stat" style="margin-top:8px"><span>rezultatas</span><strong style="font-size:1rem">'+r.sc+'</strong></div>';
  board.appendChild(pod);swarm(pod.querySelector('canvas'),st);});
 var sorted=rows.slice().sort(function(a,b){return b.sc-a.sc;});
 $('tableCard').hidden=false;
 $('tbl').innerHTML='<tr><th>Grupė</th><th>Režimas</th><th>Sprendimai</th><th>Nuolat.</th><th>Amb.</th>'+
  '<th>Nusiv.</th><th>Kokybė</th><th>Rep.</th><th>Rezultatas</th></tr>'+
  sorted.map(function(r){return '<tr><td>'+r.g+' grupė</td><td>'+
   (revealed?MODE_REAL[r.mode]:MODE_LABEL[r.mode])+'</td><td>'+r.idxs.join(' ')+'</td><td>'+
   Math.round(r.st.R)+'</td><td>'+Math.round(r.st.A)+'</td><td>'+Math.round(r.st.D)+'</td><td>'+
   r.st.Q.toFixed(2)+'</td><td>'+r.st.Rep.toFixed(2)+'</td><td><strong>'+r.sc+'</strong></td></tr>';}).join('');
 var A=rows.filter(function(r){return r.mode==='valdymas';}).map(function(r){return r.sc;});
 var B=rows.filter(function(r){return r.mode==='apribojimai';}).map(function(r){return r.sc;});
 function stats(a){if(!a.length)return null;
  var s=a.reduce(function(x,y){return x+y;},0)/a.length;
  return {avg:Math.round(s),min:Math.min.apply(null,a),max:Math.max.apply(null,a)};}
 var sa=stats(A),sb=stats(B),out=[];
 if(sa)out.push((revealed?'Tiesioginis valdymas':'Režimas A')+': vidurkis '+sa.avg+' (nuo '+sa.min+' iki '+sa.max+')');
 if(sb)out.push((revealed?'Apribojimai':'Režimas B')+': vidurkis '+sb.avg+' (nuo '+sb.min+' iki '+sb.max+')');
 if(sa&&sb&&rows[0].scen==='turbulentiskas')
  out.push('Turbulentiškoje aplinkoje svarbu ne tik vidurkis, bet ir sklaida: tiesioginis valdymas duoda ir aukščiausius, ir žemiausius rezultatus.');
 $('verdict').textContent=out.join(' · ');
}
$('drawBtn').onclick=draw;
$('revealBtn').onclick=function(){revealed=!revealed;
 $('revealBtn').textContent=revealed?'Slėpti režimus':'Atskleisti režimus';draw();};
$('codes').addEventListener('keydown',function(e){
 if((e.metaKey||e.ctrlKey)&&e.key==='Enter')draw();});
window.addEventListener('resize',draw);
(function(){
 var u=location.href.split('#')[0].replace(/ekranas\.html$/,'');
 $('url').textContent=u;
 try{ if(window.QRCode) new QRCode($('qr'),{text:u,width:190,height:190,correctLevel:QRCode.CorrectLevel.M});
      else hideQr(); }catch(e){ hideQr(); }
 function hideQr(){var q=$('qr'); if(q&&q.style) q.style.display='none';}
})();
</script>
</body>
</html>
